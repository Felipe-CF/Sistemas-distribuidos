syntax = "proto3";

option csharp_namespace = "MeuProjetoGrpc.Protos";

package blogposts;

message CreateBlogPostRequest {
  string title = 1;
  string category = 2;
  string author = 3;
  string content = 4;
}

message CreateBlogPostResponse {
  string id = 1;
}

service BlogPosts {
  rpc CreateBlogPost(CreateBlogPostRequest) returns (CreateBlogPostResponse);
}